apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apptrack.fullname" . }}-config
  labels:
    {{- include "apptrack.labels" . | nindent 4 }}
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  {{- if .Values.postgresql.enabled }}
  DB_HOST: {{ include "apptrack.fullname" . }}-postgresql
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgresql.auth.database | quote }}
  DB_USER: {{ .Values.postgresql.auth.username | quote }}
  {{- end }}
  {{- if .Values.rabbitmq.enabled }}
  RABBITMQ_HOST: {{ include "apptrack.fullname" . }}-rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: {{ .Values.rabbitmq.auth.username | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_HOST: {{ include "apptrack.fullname" . }}-redis-master
  REDIS_PORT: "6379"
  {{- end }}
  {{- if .Values.minio.enabled }}
  MINIO_ENDPOINT: {{ include "apptrack.fullname" . }}-minio:9000
  MINIO_BUCKET: {{ .Values.minio.defaultBuckets | quote }}
  {{- end }}
  # Feature flags
  FEATURE_CANARY_DEPLOY: {{ .Values.featureFlags.canaryDeploy | quote }}
  FEATURE_BLUE_GREEN_DEPLOY: {{ .Values.featureFlags.blueGreenDeploy | quote }}
  FEATURE_OTA_UPDATES: {{ .Values.featureFlags.otaUpdates | quote }}
  FEATURE_CREDENTIAL_VALIDATION: {{ .Values.featureFlags.credentialValidation | quote }}
