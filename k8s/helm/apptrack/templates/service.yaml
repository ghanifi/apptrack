{{- $root := . -}}
{{- $services := dict
  "gateway" (dict "port" 8000)
  "build-service" (dict "port" 8006)
  "store-deploy" (dict "port" 8008)
  "artifact" (dict "port" 8007)
  "preview" (dict "port" 8005)
  "frontend" (dict "port" 80)
-}}
{{- range $name, $svc := $services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apptrack.fullname" $root }}-{{ $name }}
  labels:
    {{- include "apptrack.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $svc.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "apptrack.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
{{- end }}
