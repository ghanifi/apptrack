apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-service
  labels:
    app: apptrack
    component: build-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apptrack
      component: build-service
  template:
    metadata:
      labels:
        app: apptrack
        component: build-service
    spec:
      containers:
        - name: build-service
          image: apptrack/build-service:v0.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8006
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: apptrack-secrets
                  key: rabbitmq-url
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: build-service
spec:
  type: ClusterIP
  ports:
    - port: 8006
      targetPort: 8006
  selector:
    app: apptrack
    component: build-service
---
