apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-service
  labels:
    app: apptrack
    component: artifact
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apptrack
      component: artifact
  template:
    metadata:
      labels:
        app: apptrack
        component: artifact
    spec:
      containers:
        - name: artifact
          image: apptrack/artifact-service:v0.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8007
          env:
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: apptrack-config
                  key: minio-endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: apptrack-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: apptrack-secrets
                  key: minio-secret-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-service
spec:
  type: ClusterIP
  ports:
    - port: 8007
      targetPort: 8007
  selector:
    app: apptrack
    component: artifact
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-service
  labels:
    app: apptrack
    component: preview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apptrack
      component: preview
  template:
    metadata:
      labels:
        app: apptrack
        component: preview
    spec:
      containers:
        - name: preview
          image: apptrack/preview-service:v0.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: preview-service
spec:
  type: ClusterIP
  ports:
    - port: 8005
      targetPort: 8005
  selector:
    app: apptrack
    component: preview
