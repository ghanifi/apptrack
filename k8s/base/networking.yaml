apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apptrack-ingress
  annotations:
    nginx.ingress.kubernetes.io/rate-limit-connections: "50"
    nginx.ingress.kubernetes.io/rate-limit-rps: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # E8 - Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.apptrack.io; frame-ancestors 'none'";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.apptrack.io
        - app.apptrack.io
      secretName: apptrack-tls
  rules:
    - host: api.apptrack.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: gateway
                port:
                  number: 8000
    - host: app.apptrack.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apptrack-network-policy
spec:
  podSelector:
    matchLabels:
      app: apptrack
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: apptrack
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8005
        - protocol: TCP
          port: 8006
        - protocol: TCP
          port: 8007
        - protocol: TCP
          port: 8008
  egress:
    # Allow DNS resolution (kube-dns / CoreDNS)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow internal service-to-service communication
    - to:
        - podSelector:
            matchLabels:
              app: apptrack
    # Allow external HTTPS, PostgreSQL, RabbitMQ
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5672
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apptrack-config
data:
  github-client-id: ""
  minio-endpoint: "minio:9000"
  frontend-url: "https://app.apptrack.io"
  gateway-url: "https://api.apptrack.io"
---
apiVersion: v1
kind: Secret
metadata:
  name: apptrack-secrets
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://apptrack:CHANGE_ME@postgres:5432/apptrack"
  rabbitmq-url: "amqp://apptrack:CHANGE_ME@rabbitmq:5672/"
  secret-key: "CHANGE-ME-TO-RANDOM-64-CHAR-STRING"
  fernet-salt: "CHANGE-ME-TO-RANDOM-SALT"
  service-token-secret: "CHANGE-ME-SERVICE-TOKEN"
  github-client-secret: ""
  stripe-api-key: ""
  minio-access-key: "minioadmin"
  minio-secret-key: "CHANGE_ME"
