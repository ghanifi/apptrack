[lint]
# Only check basic errors — ignore style/formatting
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E711",   # comparison to None
  "F401",   # imported but unused
  "F841",   # local variable assigned but never used
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/**" = ["F401", "F841"]
"conftest.py" = ["F401", "F841"]
