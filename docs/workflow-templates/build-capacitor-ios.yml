name: Build Capacitor iOS
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'AppTrack Build ID'
        required: true
      callback_url:
        description: 'AppTrack callback URL (build result notification)'
        required: false
        type: string
      platform:
        description: 'Target platform'
        required: true
        default: 'ios'
      project_id:
        description: 'AppTrack Project ID'
        required: true
      ios_cert_p12_base64:
        description: 'iOS Distribution Certificate P12 (base64)'
        required: false
      ios_cert_password:
        description: 'iOS Certificate password'
        required: false
      ios_provisioning_profile_base64:
        description: 'iOS Provisioning Profile (base64)'
        required: false
      appstore_api_key_id:
        description: 'App Store Connect API Key ID'
        required: false
      appstore_api_issuer_id:
        description: 'App Store Connect API Issuer ID'
        required: false
      appstore_api_key_base64:
        description: 'App Store Connect API Key .p8 (base64)'
        required: false
      auto_submit_testflight:
        description: 'Auto-submit to TestFlight after upload'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: macos-26  # Xcode 26 zorunlu (ASC 28 Nis 2026); macos-latest migrasyonu nondeterministik
    timeout-minutes: 30
    env:
      KEYCHAIN_NAME: apptrack-build-${{ github.event.inputs.build_id }}
      KEYCHAIN_PASSWORD: ${{ github.run_id }}

    steps:
      - name: "build_id=${{ github.event.inputs.build_id }}"
        run: echo "Build ID marker step"

      - uses: actions/checkout@v4

      - name: Locate app directory
        run: |
          if [ -f "package.json" ]; then
            APP_DIR="."
          else
            PKG=$(find . -maxdepth 3 -name package.json -not -path "*/.*" -not -path "*/node_modules/*" -not -path "*/build/*" -not -path "*/dist/*" | sort | head -1)
            if [ -z "$PKG" ]; then
              echo "ERROR: package.json not found anywhere (depth 3)"
              exit 1
            fi
            APP_DIR=$(dirname "$PKG")
          fi
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          echo "App directory: $APP_DIR"

      - name: Select latest Xcode (Apple 2026 SDK requirement)
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE"
            echo "Selected Xcode: $LATEST_XCODE"
          fi
          xcodebuild -version
          echo "SDK: $(xcodebuild -showsdks 2>/dev/null | grep 'iOS' | tail -1 || echo 'checking...')"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build web assets
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync ios

      - name: Ensure PrivacyInfo.xcprivacy (Apple 2026 requirement)
        working-directory: ${{ env.APP_DIR }}
        run: |
          PRIVACY_FILE="ios/App/App/PrivacyInfo.xcprivacy"
          if [ ! -f "$PRIVACY_FILE" ]; then
            echo "PrivacyInfo.xcprivacy not found — generating default..."
            mkdir -p "$(dirname "$PRIVACY_FILE")"
            cat > "$PRIVACY_FILE" << 'PRIVEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>NSPrivacyTracking</key>
            <false/>
            <key>NSPrivacyTrackingDomains</key>
            <array/>
            <key>NSPrivacyCollectedDataTypes</key>
            <array/>
            <key>NSPrivacyAccessedAPITypes</key>
            <array>
              <dict>
                <key>NSPrivacyAccessedAPIType</key>
                <string>NSPrivacyAccessedAPICategoryUserDefaults</string>
                <key>NSPrivacyAccessedAPITypeReasons</key>
                <array>
                  <string>CA92.1</string>
                </array>
              </dict>
              <dict>
                <key>NSPrivacyAccessedAPIType</key>
                <string>NSPrivacyAccessedAPICategoryDiskSpace</string>
                <key>NSPrivacyAccessedAPITypeReasons</key>
                <array>
                  <string>E174.1</string>
                </array>
              </dict>
            </array>
          </dict>
          </plist>
          PRIVEOF
            echo "Default PrivacyInfo.xcprivacy created at $PRIVACY_FILE"
          else
            echo "PrivacyInfo.xcprivacy already exists — skipping generation"
          fi

      - name: Install CocoaPods
        working-directory: ${{ env.APP_DIR }}/ios/App
        run: pod install

      - name: Setup iOS signing
        if: ${{ github.event.inputs.ios_cert_p12_base64 != '' }}
        run: |
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME.keychain-db"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME.keychain-db"
          security list-keychains -d user -s "$KEYCHAIN_NAME.keychain-db" $(security list-keychains -d user | tr -d '"')

          # Import P12 certificate
          echo "${{ github.event.inputs.ios_cert_p12_base64 }}" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 \
            -k "$KEYCHAIN_NAME.keychain-db" \
            -P "${{ github.event.inputs.ios_cert_password }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME.keychain-db"
          rm /tmp/cert.p12

          # Install provisioning profile
          echo "${{ github.event.inputs.ios_provisioning_profile_base64 }}" | base64 -d > /tmp/profile.mobileprovision
          PROFILE_UUID=$(security cms -D -i /tmp/profile.mobileprovision 2>/dev/null | plutil -extract UUID raw -)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          rm /tmp/profile.mobileprovision

      - name: Build archive (signed)
        if: ${{ github.event.inputs.ios_cert_p12_base64 != '' }}
        working-directory: ${{ env.APP_DIR }}/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            ENABLE_BITCODE=NO \
            | xcpretty

      - name: Export IPA
        working-directory: ${{ env.APP_DIR }}
        if: ${{ github.event.inputs.ios_cert_p12_base64 != '' }}
        run: |
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa-output

      - name: Upload to App Store Connect / TestFlight
        if: ${{ github.event.inputs.ios_cert_p12_base64 != '' && github.event.inputs.appstore_api_key_id != '' }}
        run: |
          # Setup App Store Connect API key
          mkdir -p ~/private_keys
          echo "${{ github.event.inputs.appstore_api_key_base64 }}" | base64 -d > ~/private_keys/AuthKey_${{ github.event.inputs.appstore_api_key_id }}.p8

          # Find the IPA
          IPA_PATH=$(find $RUNNER_TEMP/ipa-output -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found in $RUNNER_TEMP/ipa-output"
            exit 1
          fi
          echo "Uploading IPA: $IPA_PATH"

          # Upload via xcrun notarytool / altool
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "${{ github.event.inputs.appstore_api_key_id }}" \
            --apiIssuer "${{ github.event.inputs.appstore_api_issuer_id }}" \
            --show-progress

          echo "App Store upload complete!"

          # Cleanup API key
          rm -f ~/private_keys/AuthKey_${{ github.event.inputs.appstore_api_key_id }}.p8

      - name: Build simulator (unsigned)
        if: ${{ github.event.inputs.ios_cert_p12_base64 == '' }}
        working-directory: ${{ env.APP_DIR }}/ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            | xcpretty

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-ios-${{ github.event.inputs.build_id }}
          path: |
            ${{ runner.temp }}/ipa-output/*.ipa

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_NAME.keychain-db" 2>/dev/null || true

      - name: Notify AppTrack
        if: always()
        run: |
          STATUS="${{ job.status }}"
          APPTRACK_STATUS="failed"
          [ "$STATUS" = "success" ] && APPTRACK_STATUS="success"
          curl -s -X POST "${{ secrets.APPTRACK_WEBHOOK_URL }}/api/webhooks/github-build" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\":\"${{ github.event.inputs.build_id }}\",\"status\":\"$APPTRACK_STATUS\",\"provider\":\"github_actions\"}" || true
