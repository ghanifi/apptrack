# E5 - PodDisruptionBudgets for all AppTrack services
# Ensures at least 1 pod remains available during voluntary disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  labels:
    app: apptrack
    component: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: apptrack
      component: gateway
