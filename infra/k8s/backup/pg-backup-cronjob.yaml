# E7 - PostgreSQL Daily Backup CronJob
# Runs pg_dump at 03:00 UTC daily, stores to persistent volume
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  labels:
    app: apptrack
    component: backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: apptrack
            component: backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/apptrack_${TIMESTAMP}.sql.gz"
                  echo "Starting PostgreSQL backup: ${BACKUP_FILE}"
                  pg_dump "${DATABASE_URL}" | gzip > "${BACKUP_FILE}"
                  echo "Backup completed: ${BACKUP_FILE}"
                  # Cleanup backups older than 30 days
                  find /backups -name "apptrack_*.sql.gz" -mtime +30 -delete
                  echo "Cleanup completed"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: apptrack-secrets
                      key: database-url
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: apptrack-secrets
                      key: database-url
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: pg-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backup-pvc
  labels:
    app: apptrack
    component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
