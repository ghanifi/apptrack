# E10 - Secrets Template (placeholder values)
# Copy this file to secrets.yaml and fill in real values
# NEVER commit secrets.yaml with real credentials to version control
apiVersion: v1
kind: Secret
metadata:
  name: apptrack-secrets
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://apptrack:<DB_PASSWORD>@postgres:5432/apptrack"
  rabbitmq-url: "amqp://apptrack:<RABBITMQ_PASSWORD>@rabbitmq:5672/"
  secret-key: "<RANDOM_64_CHAR_SECRET_KEY>"
  fernet-salt: "<RANDOM_FERNET_SALT>"
  service-token-secret: "<RANDOM_SERVICE_TOKEN_SECRET>"
  github-client-secret: "<GITHUB_OAUTH_CLIENT_SECRET>"
  stripe-api-key: "<STRIPE_API_KEY>"
  minio-access-key: "<MINIO_ACCESS_KEY>"
  minio-secret-key: "<MINIO_SECRET_KEY>"
