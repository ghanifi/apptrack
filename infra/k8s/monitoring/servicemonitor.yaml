# E1 - Prometheus ServiceMonitor for AppTrack services
# Requires: prometheus-operator CRD (ServiceMonitor)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apptrack-gateway
  labels:
    app: apptrack
    component: gateway
    release: prometheus
spec:
  selector:
    matchLabels:
      app: apptrack
      component: gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - apptrack
