name: CD

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - { name: gateway, context: backend/gateway, port: 8000 }
          - { name: build-service, context: backend/services/build, port: 8006 }
          - { name: store-deploy, context: backend/services/store-deploy, port: 8008 }
          - { name: preview, context: backend/services/preview, port: 8005 }
          - { name: repo-sync, context: backend/services/repo-sync, port: 8003 }
          - { name: framework-detection, context: backend/services/framework-detection, port: 8004 }
          - { name: artifact, context: backend/services/artifact, port: 8007 }
          - { name: frontend, context: frontend, port: 80 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set image tags
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Deploy with Helm
        run: |
          echo "helm upgrade --install apptrack k8s/helm/apptrack --set global.image.tag=$VERSION"
